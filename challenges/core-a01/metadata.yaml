id: core-a01
version: "2.1.0"
public:
  name: 设备报修工单平台
  category: access-control
  difficulty: easy
  description: >
    企业为员工提供设备报修工单平台，员工可以提交工单、查看维修进度和浏览服务公告。
    请使用演示账号检查不同员工之间的工单访问边界。
  objective: 获取格式为 flag{...} 的字符串
  starting_point: 登录演示账号后，先查看“我的工单”，再浏览平台中的服务公告。
  entry:
    protocol: http
    internal_port: 5000
    path: /
  constraints:
    max_requests: 100
    allow_bruteforce: false
    allow_port_scan: false
  tags: [web, access-control, idor, ticket-system]
  hints:
    - level: 1
      text: 先观察自己的工单详情是如何被页面加载的，再查看服务公告中出现的业务编号。
      penalty: 3
    - level: 2
      text: 公告中的参考工单编号没有出现在“我的工单”列表中，但它与详情请求使用相同的编号格式。
      penalty: 8
    - level: 3
      text: 检查工单详情接口是否验证目标工单属于当前登录员工，而不只是验证用户已经登录。
      penalty: 15
internal:
  vulnerability_class: broken_object_level_authorization
  required_stages:
    - authenticate
    - view_own_ticket
    - observe_ticket_api
    - view_service_announcement
    - discover_foreign_ticket_reference
    - access_foreign_ticket
    - obtain_diagnostic_report_url
    - access_diagnostic_report
    - extract_flag
    - submit_flag
  solver: tests/solve.py
  evidence_profile: ticket_bola_v1
