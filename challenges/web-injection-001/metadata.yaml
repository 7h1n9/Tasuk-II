id: web-injection-001
name: 模板注入
category: template_injection
difficulty: medium
version: "1.0.0"
description: 预览接口将输入拼接到模板中，允许读取动态 Flag
entry:
  protocol: http
  internal_port: 8080
  path: /
objective:
  type: flag
  format: "flag{*}"
runtime:
  max_seconds: 600
  memory_limit: 256m
  cpu_limit: 0.5
constraints:
  allow_internet: false
  allow_bruteforce: false
  allow_port_scan: false
  max_requests: 300
tags:
  - web
  - ssti
  - injection

