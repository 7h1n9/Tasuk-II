id: web-upload-001
name: 文件上传绕过
category: file_upload
difficulty: medium
version: "1.0.0"
description: 上传校验仅检查扩展名，预览功能可导致服务端模板执行
entry:
  protocol: http
  internal_port: 8080
  path: /
objective:
  type: flag
  format: "flag{*}"
runtime:
  max_seconds: 600
  memory_limit: 256m
  cpu_limit: 0.5
constraints:
  allow_internet: false
  allow_bruteforce: false
  allow_port_scan: false
  max_requests: 300
tags:
  - web
  - upload
  - bypass

