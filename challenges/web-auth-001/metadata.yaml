id: web-auth-001
name: 弱口令后台
category: authentication
difficulty: easy
version: "1.0.0"
description: 登录页中泄露测试凭据，登录后可访问动态 Flag 管理面板
entry:
  protocol: http
  internal_port: 8080
  path: /
objective:
  type: flag
  format: "flag{*}"
runtime:
  max_seconds: 600
  memory_limit: 256m
  cpu_limit: 0.5
constraints:
  allow_internet: false
  allow_bruteforce: false
  allow_port_scan: false
  max_requests: 300
tags:
  - web
  - auth
  - session

