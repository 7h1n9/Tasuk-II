id: core-c01
version: "2.0.0"

public:
  name: 历史文档预览中心
  category: web
  difficulty: medium
  description: >
    某企业将旧版办公文档迁移至统一预览平台。请检查历史路径兼容功能，
    并找到隐藏的 Flag。
  objective: 获取格式为 flag{...} 的字符串
  starting_point: 先打开普通文档，观察预览链接，再查看迁移说明。
  entry:
    protocol: http
    internal_port: 5000
    path: /
  constraints:
    max_requests: 120
    max_runtime_seconds: 900
    allow_bruteforce: false
    allow_port_scan: false
  tags:
    - web
    - business-system
    - document-service
  hints:
    - level: 1
      text: 比较正常预览链接中的路径值和浏览器实际发送的编码形式。
      penalty: 3
    - level: 2
      text: 迁移说明提到旧客户端会额外处理附件路径，服务端也会兼容这种历史格式。
      penalty: 8
    - level: 3
      text: 路径过滤发生在兼容性规范化之前，检查同一段路径被多次解码后是否会改变目录含义。
      penalty: 15

internal:
  vulnerability_class: double_decoding_path_normalization
  required_stages:
    - access_application
    - view_document_list
    - observe_normal_preview
    - inspect_encoded_path
    - read_migration_notes
    - discover_archive_reference
    - observe_plain_traversal_rejection
    - infer_multiple_decoding
    - access_private_archive
    - extract_flag
    - submit_flag
  solver: tests/solve.py
  evidence_profile: path_normalization_v1
